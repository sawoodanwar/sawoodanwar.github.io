name: Restore index.html

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore index.html from good commit and apply Scholar aria-label fixes
        run: |
          git checkout 0cf7caaea9d613a4e6c78788da4d38b936ccdda8 -- index.html

          sed -i 's|title="Google Scholar">&#128218; Scholar</a>|title="Google Scholar" aria-label="Google Scholar profile of Sawood Anwar">&#128218; Google Scholar</a>|g' index.html

          sed -i 's|rel="noopener noreferrer me">&#128218; Google Scholar</a>|rel="noopener noreferrer me" aria-label="Google Scholar profile of Sawood Anwar \u2014 publications and citations">&#128218; Google Scholar</a>|g' index.html

          sed -i 's|rel="noopener noreferrer me">Google Scholar</a>|rel="noopener noreferrer me" aria-label="Sawood Anwar Google Scholar \u2014 full metrics and h-index">Google Scholar</a>|g' index.html

      - name: Commit and push restored file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "fix: restore full index.html + add Scholar aria-label SEO attributes"
          git push
