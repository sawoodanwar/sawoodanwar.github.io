name: Update Citation Counts

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday at 06:00 UTC
  workflow_dispatch:       # Allow manual trigger from Actions tab

jobs:
  update-citations:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch citation counts
        id: fetch
        run: |
          DOI="10.3389/fsoc.2024.1379265"
          TODAY=$(date -u +"%Y-%m-%d")

          # --- Semantic Scholar ---
          SS_JSON=$(curl -sf \
            "https://api.semanticscholar.org/graph/v1/paper/DOI:${DOI}?fields=citationCount" \
            -H "Accept: application/json" || echo '{}')
          SS_COUNT=$(echo "$SS_JSON" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d.get('citationCount','null'))" 2>/dev/null || echo null)

          # --- Crossref ---
          CR_JSON=$(curl -sf \
            "https://api.crossref.org/works/${DOI}" \
            -H "Accept: application/json" \
            -H "User-Agent: sawoodanwar-site/1.0 (mailto:anwar1524@gmail.com)" || echo '{}')
          CR_COUNT=$(echo "$CR_JSON" | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d.get('message',{}).get('is-referenced-by-count','null'))" 2>/dev/null || echo null)

          echo "ss_count=${SS_COUNT}" >> $GITHUB_OUTPUT
          echo "cr_count=${CR_COUNT}" >> $GITHUB_OUTPUT
          echo "today=${TODAY}" >> $GITHUB_OUTPUT

      - name: Write citations.json
        run: |
          cat > citations.json << 'ENDJSON'
          {
            "frontiers2024": {
              "doi": "10.3389/fsoc.2024.1379265",
              "semanticScholar": ${{ steps.fetch.outputs.ss_count }},
              "crossref": ${{ steps.fetch.outputs.cr_count }},
              "lastUpdated": "${{ steps.fetch.outputs.today }}"
            }
          }
          ENDJSON

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add citations.json
          if git diff --cached --quiet; then
            echo "No changes to citations.json — skipping commit."
          else
            git commit -m "chore(citations): auto-update counts [${{ steps.fetch.outputs.today }}]"
            git push
          fi
