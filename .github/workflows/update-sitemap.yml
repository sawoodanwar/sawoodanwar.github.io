name: Update Sitemap lastmod

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sitemap.xml'
  workflow_dispatch:

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update lastmod dates in sitemap.xml
        run: |
          TODAY=$(date -u +"%Y-%m-%d")
          # Replace all existing lastmod values with today's date
          sed -i "s|<lastmod>[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}</lastmod>|<lastmod>${TODAY}</lastmod>|g" sitemap.xml
          echo "Updated lastmod to ${TODAY}"

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if git diff --cached --quiet; then
            echo "sitemap.xml already up to date — skipping commit."
          else
            git commit -m "chore(sitemap): update lastmod to $(date -u +"%Y-%m-%d")"
            git push
          fi
