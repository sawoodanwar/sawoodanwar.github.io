<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found — Sawood Anwar, PhD</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0e1525;--surface:#16212f;--border:#243148;--text:#d8e0f0;
      --muted:#8796b4;--heading:#eef2ff;--accent:#c9a96e;--accent2:#7eafd4;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;}
    body{
      font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);
      background-image:radial-gradient(ellipse 80% 50% at 10% 0%,rgba(201,169,110,.09) 0%,transparent 55%),
                       radial-gradient(ellipse 65% 45% at 85% 100%,rgba(80,110,190,.11) 0%,transparent 60%);
      display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;
    }
    .card{
      background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--accent);
      border-radius:8px;padding:52px 56px;max-width:520px;width:100%;text-align:center;
      box-shadow:0 12px 50px rgba(0,0,0,.36);
    }
    .code{
      font-family:'EB Garamond',Georgia,serif;font-size:5rem;font-weight:600;
      color:var(--accent);line-height:1;display:block;margin-bottom:8px;
      text-shadow:0 0 32px rgba(201,169,110,.22);
    }
    h1{font-family:'EB Garamond',Georgia,serif;font-size:1.7rem;font-weight:500;color:var(--heading);margin-bottom:16px;}
    p{color:var(--muted);font-size:.95rem;line-height:1.75;margin-bottom:28px;}
    .btn{
      display:inline-flex;align-items:center;gap:8px;padding:10px 24px;
      border-radius:4px;background:var(--accent);border:none;color:#1a1000;
      font-size:.88rem;font-weight:700;text-decoration:none;
      transition:background .2s,transform .15s,box-shadow .2s;
      box-shadow:0 3px 16px rgba(201,169,110,.28);
    }
    .btn:hover{background:#e8d4a8;transform:translateY(-1px);box-shadow:0 6px 22px rgba(201,169,110,.42);}
    .ornament{font-size:1rem;color:rgba(201,169,110,.3);letter-spacing:.5em;display:block;margin-top:32px;}
  </style>
</head>
<body>
  <div class="card">
    <span class="code">404</span>
    <h1>Page Not Found</h1>
    <p>The page you were looking for doesn’t exist or may have been moved. You can return to the main profile below.</p>
    <a class="btn" href="/">← Back to Profile</a>
    <span class="ornament" aria-hidden="true">&#8258;</span>
  </div>
</body>
</html>
