    .project-card:hover{border-color:rgba(201,169,110,.38);transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,.18);}
    .proj-cat{font-size:.73rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-bottom:8px;}
    .project-card h3{font-family:'EB Garamond',Georgia,serif;font-size:1.06rem;font-weight:500;color:var(--heading);margin-bottom:8px;line-height:1.4;}
    .project-card h3 a{color:var(--heading);}
    .project-card h3 a:hover{color:var(--accent);text-decoration:none;}
    .project-card p{color:var(--muted);font-size:.87rem;line-height:1.65;}
    .pub-section{margin-bottom:30px;}
    .pub-cards{display:flex;flex-direction:column;gap:22px;margin-top:20px;}
    .pub-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color .25s,box-shadow .25s,background .3s;}
    .pub-card:hover{border-color:rgba(201,169,110,.42);box-shadow:0 8px 32px rgba(0,0,0,.24);}
    .pub-card.type-journal{border-left:4px solid var(--accent);}
    .pub-card.type-thesis{border-left:4px solid var(--purple);}
    .pub-card.type-working{border-left:4px solid var(--accent2);}
    .pub-card-inner{padding:26px 30px;}
    .pub-meta-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
    .pub-type-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.71rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;}
    .type-journal .pub-type-badge{background:rgba(201,169,110,.14);color:var(--accent);border:1px solid rgba(201,169,110,.28);}
    .type-thesis .pub-type-badge{background:rgba(157,133,212,.14);color:var(--purple);border:1px solid rgba(157,133,212,.28);}
    .type-working .pub-type-badge{background:rgba(126,175,212,.12);color:var(--accent2);border:1px solid rgba(126,175,212,.28);}
    .pub-year{font-size:.79rem;font-weight:700;color:var(--muted);letter-spacing:.05em;}
    .pub-venue-pill{font-size:.79rem;font-style:italic;color:var(--accent2);}
    .pub-oa-badge{margin-left:auto;display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:.69rem;font-weight:700;letter-spacing:.06em;background:rgba(93,184,138,.10);color:var(--green);border:1px solid rgba(93,184,138,.22);}
    .pub-status-badge{margin-left:auto;display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:.69rem;font-weight:700;letter-spacing:.06em;background:rgba(126,175,212,.10);color:var(--accent2);border:1px solid rgba(126,175,212,.22);}
    .pub-title{font-family:'EB Garamond',Georgia,serif;font-size:1.15rem;font-weight:500;color:var(--heading);line-height:1.48;margin-bottom:8px;}
    .pub-authors{font-size:.84rem;color:var(--muted);margin-bottom:12px;}
    .pub-authors strong{color:var(--heading);font-weight:600;}
    .pub-abstract{font-size:.875rem;color:var(--muted);line-height:1.78;margin-bottom:14px;border-left:2px solid var(--border);padding-left:14px;}
    .pub-keywords{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
    .pub-kw{padding:3px 10px;border-radius:20px;background:var(--tag-bg);color:var(--tag-text);font-size:.75rem;border:1px solid rgba(126,175,212,.10);}
    .pub-footer-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--border);}
    .pub-doi{font-size:.75rem;color:var(--muted);opacity:.7;font-family:'Inter',monospace;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .pub-doi a{color:var(--muted);}
    .pub-doi a:hover{color:var(--accent2);}
    .pub-action{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:4px;font-size:.81rem;font-weight:500;border:1px solid var(--border);background:var(--surface2);color:var(--accent2);transition:border-color .2s,color .2s,background .2s;white-space:nowrap;}
    .pub-action:hover{border-color:var(--accent);color:var(--accent);background:rgba(201,169,110,.05);text-decoration:none;}
    .pub-action.primary-action{background:rgba(126,175,212,.08);border-color:rgba(126,175,212,.32);}
    .pub-action.primary-action:hover{background:rgba(201,169,110,.06);border-color:var(--accent);color:var(--accent);}
    .contact-section{margin-bottom:30px;margin-top:10px;}
    .contact-form{background:var(--surface2);border:1px solid rgba(201,169,110,.30);border-top:3px solid var(--accent);border-radius:var(--radius);padding:38px 42px;box-shadow:0 0 48px rgba(201,169,110,.06),0 10px 36px rgba(0,0,0,.26);transition:background .3s;}
    .contact-form>p{color:var(--text);font-size:.96rem;margin:14px 0 0;line-height:1.8;opacity:.88;}
    .contact-form>p strong{color:var(--heading);font-weight:600;}
    .email-row{display:inline-flex;align-items:center;gap:8px;margin-top:10px;}
    .copy-email-btn{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:4px;font-size:.80rem;font-weight:500;border:1px solid rgba(201,169,110,.35);background:rgba(201,169,110,.06);color:var(--accent);cursor:pointer;transition:background .2s,border-color .2s;}
    .copy-email-btn:hover{background:rgba(201,169,110,.12);border-color:var(--accent);}
    .copy-email-btn.copied{color:var(--green);border-color:rgba(93,184,138,.4);background:rgba(93,184,138,.06);}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px;}
    .form-group{display:flex;flex-direction:column;gap:6px;}
    .form-group.full{grid-column:1/-1;}
    .form-group label{font-size:.78rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.09em;}
    .req-star{color:#e05555;margin-left:3px;}
    .form-group input,.form-group textarea,.form-group select{background:var(--input-bg);border:1px solid var(--border);border-radius:5px;padding:10px 14px;color:var(--text);font-family:'Inter',sans-serif;font-size:.9rem;transition:border-color .2s,box-shadow .2s;outline:none;}
    .form-group input::placeholder,.form-group textarea::placeholder{color:var(--muted);opacity:.6;}
    .form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(201,169,110,.13);}
    .form-group textarea{resize:vertical;min-height:130px;}
    .form-group select option{background:var(--input-bg);color:var(--text);}
    .form-submit-row{margin-top:20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;grid-column:1/-1;}
    .btn-submit{display:inline-flex;align-items:center;gap:8px;padding:11px 30px;border-radius:4px;background:var(--accent);border:none;color:#1a1000;font-size:.92rem;font-weight:700;cursor:pointer;transition:background .2s,transform .15s,box-shadow .2s;box-shadow:0 3px 16px rgba(201,169,110,.28);}
    .btn-submit:hover{background:var(--accent-light);transform:translateY(-1px);box-shadow:0 6px 22px rgba(201,169,110,.42);}
    footer{margin-top:70px;padding:26px 0 12px;border-top:1px solid var(--border);text-align:center;color:var(--muted);font-size:.82rem;}
    .footer-ornament{font-size:1.1rem;color:rgba(201,169,110,.35);margin-bottom:10px;display:block;letter-spacing:.5em;}
    footer a{color:var(--muted);}
    footer a:hover{color:var(--accent);}
    @media(max-width:860px){.grid2{grid-template-columns:1fr;}.service-grid{grid-template-columns:1fr;}h1{font-size:2.15rem;}.hero{padding:34px 26px;}.about-block,.thesis-section{padding:28px 24px;}.pub-card-inner{padding:20px 22px;}.contact-form{padding:28px 22px;}.nav-social{display:none;}}
    @media(max-width:600px){.form-grid{grid-template-columns:1fr;}}
    @media(max-width:560px){.hero{flex-direction:column;gap:22px;}.hero-photo img{width:96px;height:96px;}h1{font-size:1.9rem;}.nav{padding:12px 16px;}.pub-oa-badge{margin-left:0;}.impact-grid{grid-template-columns:1fr 1fr;}#back-top{bottom:16px;right:16px;}#theme-toggle{bottom:64px;right:16px;}}
    @media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none;}}
